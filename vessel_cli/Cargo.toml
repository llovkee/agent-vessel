[package]
name = "vessel_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", features = ["json"]}
clap = { version = "4.6", features = ["derive"]}
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"]}
vessel_core = { path = "../vessel_core"}
vessel_proxy = { path = "../vessel_proxy" }
vessel_monitor = { path = "../vessel_monitor" }
vessel_sandbox = { path = "../vessel_sandbox" }
